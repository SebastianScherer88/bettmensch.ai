[pytest]
pythonpath = src
markers =
    integration: marks tests that require real external infrastructure (e.g. a Postgres server, an S3-compatible store) rather than Layer 1's local defaults - see docker-compose/pipelines.docker-compose.yaml.
    functional: marks end-to-end tests that exercise a full pipeline run against real store combinations - see docker-compose/pipelines.docker-compose.yaml.
addopts = -vv -rfEs
