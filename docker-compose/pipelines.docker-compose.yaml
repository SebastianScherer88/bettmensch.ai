# Local infrastructure for `pipelines`'s remote store backends:
# PostgresMetadataStore (Layer 2's BaseMetadataStore flavour) and
# S3ArtifactStore (Layer 2's BaseArtifactStore flavour, backed here by
# MinIO, an S3-compatible service, rather than real AWS S3). Doubles as
# both the test infrastructure (services 1-4 below) and a local dev stack
# you can point your own `LocalRunner` scripts at and browse with a UI
# (service 5).
#
# Usage:
#   1. Testing, from the host (postgres/minio only, forwarded ports):
#        docker compose -f docker-compose/pipelines.docker-compose.yaml up -d postgres minio createbuckets
#        pytest tests/integration/pipelines tests/functional/pipelines
#   2. Testing, fully containerized (the `test` service, in-network - closer to CI):
#        docker compose -f docker-compose/pipelines.docker-compose.yaml --profile test run --rm test
#   3. Local dev stack, including the read-only viewer (service 5):
#        docker compose -f docker-compose/pipelines.docker-compose.yaml up -d
#        # then open http://localhost:8080, and/or point your own script's
#        # S3ArtifactStore/PostgresMetadataStore at localhost:9000/localhost:5433
#   docker compose -f docker-compose/pipelines.docker-compose.yaml down -v
#
# See pipelines.makefile for `make` targets wrapping all three.
#
# Credentials/ports here are local-only defaults, not meant for anything
# beyond a developer's own machine. For (1)/(3) they're also what
# tests/conftest.py's fixtures assume unless overridden via the
# BETTMENSCH_AI_TEST_POSTGRES_DSN / BETTMENSCH_AI_TEST_S3_* environment
# variables; postgres is published on 5433, not the default 5432, so this
# doesn't collide with a developer's own local Postgres. For (2), `test`
# talks to `postgres`/`minio` by service name on their container-internal
# ports instead - see its own `environment` below; `frontend` does the same.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bettmensch_ai
      POSTGRES_PASSWORD: bettmensch_ai
      POSTGRES_DB: bettmensch_ai_metadata
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bettmensch_ai -d bettmensch_ai_metadata"]
      interval: 2s
      timeout: 3s
      retries: 30

  minio:
    # quay.io, not Docker Hub's `minio/minio`: some Docker Hub registry
    # mirrors/proxies (seen in this project's own CI/dev sandboxes) allow
    # official `library/*` images but block third-party org images like
    # `minio/minio`, while quay.io's copy pulls fine either way.
    image: quay.io/minio/minio:latest
    environment:
      MINIO_ROOT_USER: bettmensch_ai
      MINIO_ROOT_PASSWORD: bettmensch_ai_secret
    ports:
      - "9000:9000"
      - "9001:9001"
    command: ["server", "/data", "--console-address", ":9001"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 2s
      timeout: 3s
      retries: 30

  metadata-service:
    # The only process in this stack holding a Postgres DSN - every other
    # process (frontend, test, a dev's own LocalRunner script) talks to
    # metadata through this service's HTTP API via RemoteMetadataStore/
    # MetadataClient instead. Not profile-gated: part of the default
    # `up`/`up -d`, same as `frontend` (usage (3) above), and also needed
    # in-network by `test` (usage (2)) for the functional e2e test.
    build:
      context: ..
      dockerfile: docker/metadata-service/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      BETTMENSCH_AI_POSTGRES_METADATA_STORE_DSN: postgresql://bettmensch_ai:bettmensch_ai@postgres:5432/bettmensch_ai_metadata

  test:
    # Only runs when explicitly asked for (`--profile test run --rm test`,
    # or via `make pipelines.test.docker`) - never started by a plain
    # `up`/`up -d postgres minio`, which is host-invocation usage (1) above.
    profiles: ["test"]
    build:
      # Repo root, not this directory: the Dockerfile needs the root
      # pyproject.toml/uv.lock plus the src/ and tests/ trees, not just this
      # docker-compose folder.
      context: ..
      dockerfile: docker-compose/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      metadata-service:
        condition: service_healthy
    environment:
      # Container-internal service names/ports, not the host-forwarded
      # localhost:5433/localhost:9000 tests/conftest.py defaults to -
      # `test` reaches `postgres`/`minio` over the compose network directly.
      BETTMENSCH_AI_TEST_POSTGRES_DSN: postgresql://bettmensch_ai:bettmensch_ai@postgres:5432/bettmensch_ai_metadata
      BETTMENSCH_AI_TEST_S3_ENDPOINT_URL: http://minio:9000
      BETTMENSCH_AI_TEST_S3_ACCESS_KEY_ID: bettmensch_ai
      BETTMENSCH_AI_TEST_S3_SECRET_ACCESS_KEY: bettmensch_ai_secret
      BETTMENSCH_AI_TEST_METADATA_SERVICE_URL: http://metadata-service:8081

  createbuckets:
    # One-shot: ensures the local dev bucket exists, then exits.
    # `S3ArtifactStore` deliberately never creates its own bucket (see its
    # docstring - provisioning storage is a deployment concern, not a
    # runtime one), and unlike the `test` service's own disposable test
    # bucket (created by tests/conftest.py's fixture), nothing else here
    # creates this one for real local-dev usage (3). Reuses the `frontend`
    # image (boto3 is already a hard dependency there) rather than the
    # usual `minio/mc` client image - this environment's own Docker
    # registry mirror blocks *both* `minio/minio` and `minio/mc` as
    # third-party org images (only `library/*` pulls fine here), so a
    # plain-Python/boto3 one-liner sidesteps that entirely.
    build:
      context: ..
      dockerfile: docker/frontend/Dockerfile
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - python
      - -c
      - |
        import boto3, botocore.exceptions
        client = boto3.client(
            "s3", endpoint_url="http://minio:9000", region_name="us-east-1",
            aws_access_key_id="bettmensch_ai", aws_secret_access_key="bettmensch_ai_secret",
        )
        try:
            client.head_bucket(Bucket="bettmensch-ai-artifacts")
            print("bucket already exists")
        except botocore.exceptions.ClientError:
            client.create_bucket(Bucket="bettmensch-ai-artifacts")
            print("bucket created")

  frontend:
    # Not profile-gated, unlike `test`: part of the default `up`/`up -d`,
    # since it's meant to be the normal way to browse whatever's in
    # postgres/minio locally - see usage (3) above.
    build:
      context: ..
      dockerfile: docker/frontend/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      createbuckets:
        condition: service_completed_successfully
      metadata-service:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      # Metadata is read through the metadata service, not a direct
      # Postgres connection - see docker/frontend/backend/stores.py.
      BETTMENSCH_AI_METADATA_CLIENT_BACKEND: remote
      BETTMENSCH_AI_METADATA_SERVICE_BASE_URL: http://metadata-service:8081/api
      # The artifact store's own native config, not the BETTMENSCH_AI_TEST_*
      # ones - this is a real consumer of it, not a test.
      BETTMENSCH_AI_S3_ARTIFACT_STORE_BUCKET: bettmensch-ai-artifacts
      BETTMENSCH_AI_S3_ARTIFACT_STORE_ENDPOINT_URL: http://minio:9000
      BETTMENSCH_AI_S3_ARTIFACT_STORE_AWS_ACCESS_KEY_ID: bettmensch_ai
      BETTMENSCH_AI_S3_ARTIFACT_STORE_AWS_SECRET_ACCESS_KEY: bettmensch_ai_secret
